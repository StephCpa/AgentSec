name: Verify research reference
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            dependencies: pinned
          - python: '3.12'
            dependencies: upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        if: matrix.dependencies == 'pinned'
        run: python -m pip install -r outputs/agent-cryptography-design-20261025/prototype/requirements.txt
      - name: Install upgrade comparison dependencies
        if: matrix.dependencies == 'upgrade'
        run: python -m pip install --upgrade cryptography
      - name: Verify in disposable copy
        run: python scripts/verify.py --models --output verification-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.dependencies }}-${{ matrix.python }}
          path: verification-run/
